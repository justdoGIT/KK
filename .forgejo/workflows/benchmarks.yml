name: Performance benchmarks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  benchmarks:
    runs-on: ci-standard
    timeout-minutes: 20
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.forgejo/actions/setup-node
      - name: Run Vitest benchmarks
        shell: bash
        run: |
          set -euo pipefail
          npm run bench 2>&1 | tee benchmark-results.log
      - name: Publish benchmark results
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: benchmark-results
          path: benchmark-results.log
          if-no-files-found: ignore
          retention-days: 90
