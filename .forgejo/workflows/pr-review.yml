name: PR Review
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dependency-review:
    if: github.event.pull_request.draft == false
    runs-on: ci-standard
    # Reach the host's private HTTPS listener through Podman's rootless gateway.
    # Keep the canonical URL and TLS certificate verification unchanged.
    container:
      image: 192.168.1.4:3000/justdogit/ci-standard-py@sha256:56793c3e56ef254831c47dca8138f95b4450f7926dc61c1aca161d32da62514f
      options: --add-host=forgejo.kepr.dev:host-gateway
    timeout-minutes: 15
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.forgejo/actions/setup-node
      - name: Review dependency vulnerabilities
        run: npm audit --audit-level=moderate
  browser-review:
    name: browser-review (${{ matrix.suite }})
    if: github.event.pull_request.draft == false
    runs-on: ci-standard
    # Reach the host's private HTTPS listener through Podman's rootless gateway.
    # Keep the canonical URL and TLS certificate verification unchanged.
    container:
      image: 192.168.1.4:3000/justdogit/ci-standard-py@sha256:56793c3e56ef254831c47dca8138f95b4450f7926dc61c1aca161d32da62514f
      options: --add-host=forgejo.kepr.dev:host-gateway
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - suite: runtime-and-cards
            files: e2e/runtime.spec.ts e2e/smoke.spec.ts e2e/card-tour-motion.spec.ts
          - suite: phone-and-short-screen
            files: e2e/mobile-layout.spec.ts
    steps:
      - uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.forgejo/actions/setup-node
      - name: Build production site
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Review ${{ matrix.suite }}
        run: npx playwright test ${{ matrix.files }} --workers=1 --reporter=line,html --max-failures=1
      - name: Upload browser reports
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: pr-browser-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
