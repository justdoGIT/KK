name: Dependency Updates

on:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without applying dependency updates
        required: false
        type: boolean
        default: true

jobs:
  update:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-dependency-updates.yml@9bf9ceb455ca0d4e577d87d4974cabc1d67d7e74
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
