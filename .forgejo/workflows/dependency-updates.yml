name: Dependency Updates

on:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without applying dependency updates
        required: false
        type: boolean
        default: true

jobs:
  update:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-dependency-updates.yml@adc59dff91d1749cf4d66c58581ad37fb175bc1b
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
