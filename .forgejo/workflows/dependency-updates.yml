name: Dependency Updates

on:
  schedule:
    - cron: '27 4 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run without applying dependency updates
        required: false
        type: boolean
        default: true

jobs:
  update:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-dependency-updates.yml@d6783383d1d566ff6ea0b803a869bb5766e81c78
    with:
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
