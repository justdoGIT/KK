name: Code scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: ci-standard
    # Reach the host's private HTTPS listener through Podman's rootless gateway.
    # Keep the canonical URL and TLS certificate verification unchanged.
    container:
      image: 192.168.1.4:3000/justdogit/ci-standard-py@sha256:56793c3e56ef254831c47dca8138f95b4450f7926dc61c1aca161d32da62514f
      options: --add-host=forgejo.kepr.dev:host-gateway
    timeout-minutes: 60
    # Keep the scan portable without fetching a private reusable workflow over
    # the runner's old HTTP registration URL. Preserve its pinned scanner.
    steps:
      - name: Checkout pull request source without persisted credentials
        uses: https://data.forgejo.org/actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install pinned Semgrep
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends python3-venv
          python3 -m venv "$RUNNER_TEMP/semgrep-env"
          "$RUNNER_TEMP/semgrep-env/bin/pip" install --disable-pip-version-check semgrep==1.182.0
          echo "$RUNNER_TEMP/semgrep-env/bin" >> "$GITHUB_PATH"
      - name: Scan source and write SARIF
        run: semgrep scan --config p/default --metrics=off --sarif --output "$RUNNER_TEMP/semgrep.sarif" .
      - name: Summarize findings
        if: always()
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          sarif = Path(os.environ["RUNNER_TEMP"]) / "semgrep.sarif"
          if sarif.is_file():
              findings = sum(len(run.get("results", [])) for run in json.loads(sarif.read_text()).get("runs", []))
              text = (
                  "## Semgrep source scan\n\n"
                  f"Findings: **{findings}**\n\n"
                  "SARIF is attached as a workflow artifact. Findings do not fail "
                  "the job; scanner errors do.\n"
              )
          else:
              text = "## Semgrep source scan\n\nNo SARIF output was produced; inspect the failed scanner step.\n"
          summary = os.environ.get("FORGEJO_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as output:
                  output.write(text)
          else:
              print(text)
          PY
      - name: Retain SARIF results
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # v3
        with:
          name: semgrep-${{ forgejo.run_number }}
          path: ${{ runner.temp }}/semgrep.sarif
          if-no-files-found: ignore
          retention-days: 90
