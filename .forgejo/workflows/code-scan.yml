name: Code scan
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "47 4 * * 1"
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  semgrep:
    runs-on: ci-standard
    # Private template authentication must match the registered runner instance.
    # Migrate that registration before switching this reference to HTTPS.
    uses: http://192.168.1.4:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-code-scan.yml@83ac654c9b72024842eb7ea1163a3c403acf90d4
