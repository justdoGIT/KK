name: Performance measurements

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: Create Cargo baselines on this runner for review.
        required: false
        type: boolean
        default: false

jobs:
  performance:
    runs-on: ci-rust
    uses: http://192.168.1.4:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@1ea034f9280754dd4b146131f5d6486e4c32cb1d
    with:
      runner_label: ci-rust
      templates_ref: 1ea034f9280754dd4b146131f5d6486e4c32cb1d
      seed_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
