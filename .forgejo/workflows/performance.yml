name: Performance

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: Seed the performance baseline
        required: false
        type: boolean
        default: false

jobs:
  performance:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@adc59dff91d1749cf4d66c58581ad37fb175bc1b
    with:
      templates_ref: adc59dff91d1749cf4d66c58581ad37fb175bc1b
      seed_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
