        description: Seed the performance baseline
        required: false
        type: boolean
        default: false

jobs:
  performance:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@d6783383d1d566ff6ea0b803a869bb5766e81c78
    with:
