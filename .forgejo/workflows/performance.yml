name: Performance measurements

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: Create Cargo baselines on this runner for review.
        required: false
        type: boolean
        default: false

jobs:
  performance:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@cac1bdb4395e636dbbebc0c121f54e60c839e836
    with:
      runner_label: ci-standard
      templates_ref: cac1bdb4395e636dbbebc0c121f54e60c839e836
      seed_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
