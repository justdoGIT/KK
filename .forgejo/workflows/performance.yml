name: Performance measurements

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: Create Cargo baselines on this runner for review.
        required: false
        type: boolean
        default: false

jobs:
  performance:
    runs-on: ci-rust
    uses: http://192.168.1.4:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@1b9b18e23828cd137469e50c501bd520ce3129c0
    with:
      runner_label: ci-rust
      templates_ref: 1b9b18e23828cd137469e50c501bd520ce3129c0
      seed_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
