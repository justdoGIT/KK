name: Performance measurements

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      seed_baseline:
        description: Create Cargo baselines on this runner for review.
        required: false
        type: boolean
        default: false

jobs:
  performance:
    uses: http://lenovo.local:3000/justdoGIT/ci-templates/.forgejo/workflows/reusable-performance.yml@7e453d404a02e979c348b8aa5403cc03472ca098
    with:
      templates_ref: 7e453d404a02e979c348b8aa5403cc03472ca098
      seed_baseline: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_baseline }}
