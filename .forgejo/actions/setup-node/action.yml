name: Install Node and portfolio dependencies
description: Use the supported Node version without GitHub cache services.
runs:
  using: composite
  steps:
    - uses: https://data.forgejo.org/actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version-file: .nvmrc
        token: ""
    - name: Install stable npm
      shell: bash
      run: npm install --global npm@11.19.1 --silent
    - name: Install dependencies
      shell: bash
      run: npm ci
