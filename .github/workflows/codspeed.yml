name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allows CodSpeed to trigger backtest performance analysis
  # in order to generate initial data.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OpenID Connect authentication with CodSpeed

jobs:
  benchmarks:
    name: Run benchmarks
    # Match the recorded baseline; ubuntu-latest can change OS and CPU families.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Benchmark independently of the application's supported Node version.
          node-version: 24.22.2
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          mode: simulation
          run: npm run bench
