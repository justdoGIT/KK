name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Publication validation
        run: npm run validate:publication

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Post-deploy smoke test
        run: |
          url="${{ steps.deploy.outputs.page_url }}"
          echo "Deployed URL: $url"

          status=$(curl -sL -o /dev/null -w "%{http_code}" "$url")
          echo "HTTP status: $status"

          if [ "$status" != "200" ]; then
            echo "FAIL: deployed site returned $status"
            exit 1
          fi

          body=$(curl -sL "$url")

          if echo "$body" | grep -qi "grok-build"; then
            echo "FAIL: prohibited term found in deployed output"
            exit 1
          fi

          if echo "$body" | grep -q "/home/"; then
            echo "FAIL: local path found in deployed output"
            exit 1
          fi

          echo "PASS: post-deploy smoke test"
