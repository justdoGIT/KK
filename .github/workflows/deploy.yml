name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SITE_URL: https://justdogit.github.io/

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.server_url == 'https://github.com' &&
      github.repository == 'justdoGIT/justdogit.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Record source commit
        id: source
        run: |
          set -euo pipefail
          source_sha=$(git rev-parse HEAD)
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'Source commit: %s\n' "$source_sha"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build -- --base=/

      - name: Unit tests
        run: npm test

      - name: Publication validation
        run: npm run validate:publication

      - name: Check bundle budgets
        run: node scripts/check-bundle-budgets.mjs

      - name: Record published source
        env:
          SOURCE_SHA: ${{ steps.source.outputs.source_sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("dist/source-version.json").write_text(
              json.dumps({"repository": os.environ["SOURCE_REPOSITORY"], "commit": os.environ["SOURCE_SHA"]}) + "\n"
          )
          PY

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist/

  deploy:
    if: github.server_url == 'https://github.com' && needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Post-deploy smoke test
        env:
          DEPLOYED_URL: ${{ steps.deploy.outputs.page_url }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.request import urlopen

          root = os.environ["SITE_URL"]
          deployed = os.environ["DEPLOYED_URL"]
          if deployed.rstrip("/") != root.rstrip("/"):
              raise RuntimeError("The publisher must deploy to the root website")
          for attempt in range(6):
              try:
                  with urlopen(deployed + "?commit=" + os.environ["SOURCE_SHA"], timeout=20) as response:
                      body = response.read().decode("utf-8")
                  if "grok-build" in body.lower() or "/home/" in body:
                      raise RuntimeError("Private or prohibited content in the deployed HTML")
                  if '<div id="root"></div>' not in body or 'type="module"' not in body:
                      raise RuntimeError("The root site must serve the portfolio application")
                  with urlopen(root + "source-version.json?commit=" + os.environ["SOURCE_SHA"], timeout=20) as response:
                      version = json.load(response)
                  if version != {"repository": os.environ["SOURCE_REPOSITORY"], "commit": os.environ["SOURCE_SHA"]}:
                      raise RuntimeError("The root site has not served the expected source commit yet")
                  print("PASS: root website")
                  break
              except (OSError, ValueError, RuntimeError):
                  if attempt == 5:
                      raise
                  time.sleep(10)
          PY
