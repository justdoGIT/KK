name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Upgrade npm to stable version
        run: npm i -g npm@10 --silent

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Publication validation
        run: npm run validate:publication

      - name: Check bundle budgets
        run: node scripts/check-bundle-budgets.mjs

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 90

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            evidence/manifest.v1.json
            docs/dependency-matrix.json
          retention-days: 90
