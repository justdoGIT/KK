name: AI Review

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: true

jobs:
  ai-review:
    # Dependabot pull requests are skipped: GitHub gives their workflow runs a
    # restricted token, so the review could not post its comment (PR 58 failed
    # with 403), and a dependency bump has no code of ours to review. A manual
    # run (workflow_dispatch) can still review any pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.repository.default_branch || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Review changed code with NVIDIA Nemotron Ultra
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: node scripts/ai-pr-review.mjs
