<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#0d1b2a"/>
      <stop offset="100%" stop-color="#0a0a0b"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Geometric artifact -->
  <g transform="translate(600, 250)">
    <g stroke="#7dd3fc" stroke-width="1.5" fill="none" opacity="0.4">
      <polygon points="0,-90 78,-45 78,45 0,90 -78,45 -78,-45"/>
    </g>
    <g stroke="#7dd3fc" stroke-width="1" fill="none" opacity="0.2">
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"/>
      <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"/>
    </g>
    <g fill="#7dd3fc">
      <circle cx="0" cy="0" r="5" opacity="0.9"/>
      <circle cx="0" cy="-90" r="3" opacity="0.6"/>
      <circle cx="78" cy="-45" r="3" opacity="0.6"/>
      <circle cx="78" cy="45" r="3" opacity="0.6"/>
      <circle cx="0" cy="90" r="3" opacity="0.6"/>
      <circle cx="-78" cy="45" r="3" opacity="0.6"/>
      <circle cx="-78" cy="-45" r="3" opacity="0.6"/>
    </g>
    <g stroke="#7dd3fc" stroke-width="0.8" opacity="0.25">
      <line x1="0" y1="0" x2="0" y2="-90"/>
      <line x1="0" y1="0" x2="78" y2="-45"/>
      <line x1="0" y1="0" x2="78" y2="45"/>
      <line x1="0" y1="0" x2="0" y2="90"/>
      <line x1="0" y1="0" x2="-78" y2="45"/>
      <line x1="0" y1="0" x2="-78" y2="-45"/>
    </g>
  </g>

  <!-- Circuit traces -->
  <g stroke="#7dd3fc" stroke-width="1" fill="none" opacity="0.08">
    <path d="M0 420 H200 V380 H350 V460 H500"/>
    <path d="M700 420 H850 V380 H1000 V460 H1200"/>
    <path d="M0 500 H150 V470 H300 V530 H450 V490 H600"/>
    <path d="M600 490 H750 V530 H900 V470 H1050 V500 H1200"/>
    <circle cx="200" cy="420" r="2" fill="#7dd3fc" opacity="0.15"/>
    <circle cx="350" cy="380" r="2" fill="#7dd3fc" opacity="0.15"/>
    <circle cx="500" cy="460" r="2" fill="#7dd3fc" opacity="0.15"/>
    <circle cx="850" cy="380" r="2" fill="#7dd3fc" opacity="0.15"/>
    <circle cx="1000" cy="460" r="2" fill="#7dd3fc" opacity="0.15"/>
  </g>

  <!-- Text -->
  <text x="600" y="400" text-anchor="middle" font-family="system-ui, sans-serif" font-size="42" font-weight="700" fill="#e8e8e8" letter-spacing="-1">
    Kamal Pandey
  </text>
  <text x="600" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="400" fill="#888888">
    Embedded Systems, Linux BSP &amp; Low-Level Architecture
  </text>
  <rect x="300" y="460" width="600" height="1" fill="url(#accent-line)"/>
  <text x="600" y="490" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" fill="#555555" letter-spacing="2">
    BOARD BRING-UP · FIRMWARE · SYSTEMS SOFTWARE
  </text>
</svg>
